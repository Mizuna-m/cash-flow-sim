services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      pull: false
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cash_flow_sim
      BASE_CURRENCY: JPY
      DEFAULT_CARD_ID: default-card
      SHORT_THRESHOLD: "0"
    volumes:
      - .:/app:Z
      - /app/node_modules
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cash_flow_sim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z

volumes:
  postgres-data:
