openapi: 3.1.0
info:
  title: Cash Flow Simulator API
  version: 0.1.0
  summary: MVP API specification for the cash flow simulation system
  description: |
    Frontend handoff specification for the current MVP API.

    Maintenance rule:
    - When request/response shapes, query parameters, status codes, or endpoint behavior change,
      update this OpenAPI document in the same change set.
    - Treat this file as the canonical contract for frontend implementation and API review.
servers:
  - url: http://127.0.0.1:3000
    description: Local development
tags:
  - name: Health
  - name: Accounts
  - name: CreditCards
  - name: Transactions
  - name: ScheduledEvents
  - name: BalanceEvents
  - name: CardPayments
  - name: Simulation
  - name: SimulationComparison
  - name: Import
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Get application health
      operationId: getHealth
      responses:
        "200":
          description: Application health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
    post:
      tags: [Accounts]
      summary: Create account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit-cards:
    get:
      tags: [CreditCards]
      summary: List credit cards
      operationId: listCreditCards
      responses:
        "200":
          description: Credit card list
          content:
            application/json:
              schema:
                type: object
                required: [creditCards]
                properties:
                  creditCards:
                    type: array
                    items:
                      $ref: "#/components/schemas/CreditCard"
    post:
      tags: [CreditCards]
      summary: Create credit card
      operationId: createCreditCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditCardCreateRequest"
      responses:
        "201":
          description: Created credit card
          content:
            application/json:
              schema:
                type: object
                required: [creditCard]
                properties:
                  creditCard:
                    $ref: "#/components/schemas/CreditCard"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit-cards/{id}:
    patch:
      tags: [CreditCards]
      summary: Update credit card
      operationId: updateCreditCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditCardUpdateRequest"
      responses:
        "200":
          description: Updated credit card
          content:
            application/json:
              schema:
                type: object
                required: [creditCard]
                properties:
                  creditCard:
                    $ref: "#/components/schemas/CreditCard"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [CreditCards]
      summary: Delete credit card
      operationId: deleteCreditCard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      responses:
        "200":
          description: Deleted credit card
          content:
            application/json:
              schema:
                type: object
                required: [creditCard]
                properties:
                  creditCard:
                    $ref: "#/components/schemas/CreditCard"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      operationId: listTransactions
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
    post:
      tags: [Transactions]
      summary: Create transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                type: object
                required: [transaction]
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/transactions/{id}:
    delete:
      tags: [Transactions]
      summary: Delete transaction
      operationId: deleteTransaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      responses:
        "200":
          description: Deleted transaction
          content:
            application/json:
              schema:
                type: object
                required: [transaction]
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/import/spreadsheet:
    post:
      tags: [Import]
      summary: Preview or import spreadsheet rows
      operationId: importSpreadsheet
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [preview, import]
                  default: preview
                sheetName:
                  type: string
                profile:
                  $ref: "#/components/schemas/SpreadsheetImportProfile"
      responses:
        "200":
          description: Spreadsheet preview
          content:
            application/json:
              schema:
                type: object
                required: [preview]
                properties:
                  preview:
                    $ref: "#/components/schemas/SpreadsheetImportPreview"
        "201":
          description: Spreadsheet imported
          content:
            application/json:
              schema:
                type: object
                required: [preview, result]
                properties:
                  preview:
                    $ref: "#/components/schemas/SpreadsheetImportPreview"
                  result:
                    $ref: "#/components/schemas/SpreadsheetImportResult"
        "400":
          description: Validation or import error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/scheduled-events:
    get:
      tags: [ScheduledEvents]
      summary: List scheduled events
      operationId: listScheduledEvents
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - name: isActive
          in: query
          required: false
          description: Filter by active flag
          schema:
            type: boolean
      responses:
        "200":
          description: Scheduled event list
          content:
            application/json:
              schema:
                type: object
                required: [scheduledEvents]
                properties:
                  scheduledEvents:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledEvent"
    post:
      tags: [ScheduledEvents]
      summary: Create scheduled event
      operationId: createScheduledEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledEventCreateRequest"
      responses:
        "201":
          description: Created scheduled event
          content:
            application/json:
              schema:
                type: object
                required: [scheduledEvent]
                properties:
                  scheduledEvent:
                    $ref: "#/components/schemas/ScheduledEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/scheduled-events/{id}:
    patch:
      tags: [ScheduledEvents]
      summary: Update scheduled event
      operationId: updateScheduledEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledEventUpdateRequest"
      responses:
        "200":
          description: Updated scheduled event
          content:
            application/json:
              schema:
                type: object
                required: [scheduledEvent]
                properties:
                  scheduledEvent:
                    $ref: "#/components/schemas/ScheduledEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/balance-events:
    get:
      tags: [BalanceEvents]
      summary: List balance events
      operationId: listBalanceEvents
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Balance event list
          content:
            application/json:
              schema:
                type: object
                required: [balanceEvents]
                properties:
                  balanceEvents:
                    type: array
                    items:
                      $ref: "#/components/schemas/BalanceEvent"
    post:
      tags: [BalanceEvents]
      summary: Create balance event
      operationId: createBalanceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceEventCreateRequest"
      responses:
        "201":
          description: Created balance event
          content:
            application/json:
              schema:
                type: object
                required: [balanceEvent]
                properties:
                  balanceEvent:
                    $ref: "#/components/schemas/BalanceEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/balance-events/{id}:
    delete:
      tags: [BalanceEvents]
      summary: Delete balance event
      operationId: deleteBalanceEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      responses:
        "200":
          description: Deleted balance event
          content:
            application/json:
              schema:
                type: object
                required: [balanceEvent]
                properties:
                  balanceEvent:
                    $ref: "#/components/schemas/BalanceEvent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/card-payments:
    get:
      tags: [CardPayments]
      summary: List card payments
      operationId: listCardPayments
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Card payment list
          content:
            application/json:
              schema:
                type: object
                required: [cardPayments]
                properties:
                  cardPayments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CardPayment"
    post:
      tags: [CardPayments]
      summary: Create card payment
      operationId: createCardPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPaymentCreateRequest"
      responses:
        "201":
          description: Created card payment
          content:
            application/json:
              schema:
                type: object
                required: [cardPayment]
                properties:
                  cardPayment:
                    $ref: "#/components/schemas/CardPayment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/card-payments/{id}:
    delete:
      tags: [CardPayments]
      summary: Delete card payment
      operationId: deleteCardPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidLike"
      responses:
        "200":
          description: Deleted card payment
          content:
            application/json:
              schema:
                type: object
                required: [cardPayment]
                properties:
                  cardPayment:
                    $ref: "#/components/schemas/CardPayment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/simulation/compare:
    post:
      tags: [SimulationComparison]
      summary: Compare simulations by excluding event IDs
      operationId: compareSimulations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationComparisonRequest"
      responses:
        "200":
          description: Simulation comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationComparisonResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/simulation:
    get:
      tags: [Simulation]
      summary: Get simulation result
      operationId: getSimulation
      parameters:
        - $ref: "#/components/parameters/SimulationStartDate"
        - $ref: "#/components/parameters/SimulationEndDate"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        "500":
          description: Simulation build error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationErrorResponse"

components:
  parameters:
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive start date filter (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive end date filter (`YYYY-MM-DD`)
      schema:
        type: string
        format: date
    SimulationStartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive simulation start date. Defaults to `2026-03-01`.
      schema:
        type: string
        format: date
        default: "2026-03-01"
    SimulationEndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive simulation end date. Defaults to `2026-03-31`.
      schema:
        type: string
        format: date
        default: "2026-03-31"
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    SimulationErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
    HealthResponse:
      type: object
      required: [status, baseCurrency, defaultCardId]
      properties:
        status:
          type: string
          enum: [ok]
        baseCurrency:
          type: string
        defaultCardId:
          type: string

    JsonTags:
      type: object
      additionalProperties: true
      description: Flexible tag payload. Current usage commonly includes `category` and `project`.

    AccountType:
      type: string
      enum: [cash, bank, credit, loan, investment]

    Account:
      type: object
      required:
        [id, name, type, currency, initialBalance, isActive, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        name:
          type: string
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        initialBalance:
          type: string
          description: Decimal string
          example: "250000.00"
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    AccountCreateRequest:
      type: object
      required: [name, type, currency, initialBalance]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/AccountType"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        initialBalance:
          oneOf:
            - type: string
            - type: number

    CreditCard:
      type: object
      required:
        [id, name, closingDay, paymentDay, settlementAccountId, currency, isDefault, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        name:
          type: string
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        paymentDay:
          type: integer
          minimum: 1
          maximum: 31
        settlementAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        isDefault:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CreditCardCreateRequest:
      type: object
      required: [name, closingDay, paymentDay, currency]
      properties:
        name:
          type: string
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        paymentDay:
          type: integer
          minimum: 1
          maximum: 31
        settlementAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        isDefault:
          type: boolean
          default: false

    CreditCardUpdateRequest:
      type: object
      properties:
        name:
          type: string
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        paymentDay:
          type: integer
          minimum: 1
          maximum: 31
        settlementAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        isDefault:
          type: boolean

    Transaction:
      type: object
      required:
        [id, date, amount, accountId, payee, payeeDetail, description, note, categoryPath, tags, cardId, orderIndex, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        date:
          type: string
          format: date
        amount:
          type: string
          description: Signed decimal string
        accountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        payee:
          type: string
        payeeDetail:
          type: array
          items:
            type: string
        description:
          type: string
        note:
          type: string
        categoryPath:
          type: array
          items:
            type: string
        tags:
          $ref: "#/components/schemas/JsonTags"
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        orderIndex:
          type: integer
          minimum: 0
        createdAt:
          type: string
        updatedAt:
          type: string

    TransactionCreateRequest:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        amount:
          oneOf:
            - type: string
            - type: number
        accountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        payee:
          type: string
          default: ""
        payeeDetail:
          type: array
          items:
            type: string
        description:
          type: string
          default: ""
        note:
          type: string
          default: ""
        categoryPath:
          type: array
          items:
            type: string
        tags:
          $ref: "#/components/schemas/JsonTags"
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        orderIndex:
          type: integer
          minimum: 0
          default: 0

    ScheduledEvent:
      type: object
      required:
        [id, name, startDate, endDate, recurrenceRule, amount, accountId, tags, cardId, isActive, orderIndex, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        recurrenceRule:
          anyOf:
            - type: string
            - type: "null"
        amount:
          type: string
        accountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        tags:
          $ref: "#/components/schemas/JsonTags"
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        isActive:
          type: boolean
        orderIndex:
          type: integer
          minimum: 0
        createdAt:
          type: string
        updatedAt:
          type: string

    ScheduledEventCreateRequest:
      type: object
      required: [name, startDate, amount]
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        recurrenceRule:
          anyOf:
            - type: string
            - type: "null"
        amount:
          oneOf:
            - type: string
            - type: number
        accountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        tags:
          $ref: "#/components/schemas/JsonTags"
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        isActive:
          type: boolean
          default: true
        orderIndex:
          type: integer
          minimum: 0
          default: 0

    ScheduledEventUpdateRequest:
      type: object
      properties:
        isActive:
          type: boolean

    BalanceEvent:
      type: object
      required:
        [id, date, fromAccountId, toAccountId, amount, memo, orderIndex, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        date:
          type: string
          format: date
        fromAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        toAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        amount:
          type: string
        memo:
          type: string
        orderIndex:
          type: integer
          minimum: 0
        createdAt:
          type: string
        updatedAt:
          type: string

    BalanceEventCreateRequest:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
          format: date
        fromAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        toAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        amount:
          oneOf:
            - type: string
            - type: number
        memo:
          type: string
          default: ""
        orderIndex:
          type: integer
          minimum: 0
          default: 0

    CardPayment:
      type: object
      required:
        [id, creditCardId, sourceAccountId, date, amount, memo, orderIndex, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UuidLike"
        creditCardId:
          $ref: "#/components/schemas/UuidLike"
        sourceAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        date:
          type: string
          format: date
        amount:
          type: string
        memo:
          type: string
        orderIndex:
          type: integer
          minimum: 0
        createdAt:
          type: string
        updatedAt:
          type: string

    CardPaymentCreateRequest:
      type: object
      required: [creditCardId, date, amount]
      properties:
        creditCardId:
          $ref: "#/components/schemas/UuidLike"
        sourceAccountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        date:
          type: string
          format: date
        amount:
          oneOf:
            - type: string
            - type: number
        memo:
          type: string
          default: ""
        orderIndex:
          type: integer
          minimum: 0
          default: 0

    DailySimulationSnapshot:
      type: object
      required:
        [
          date,
          theoreticalBalance,
          actualBalance,
          short,
          cardBalances,
          liquidAccountBalances,
          negativeLiquidAccountIds,
          eventSummary,
          events
        ]
      properties:
        date:
          type: string
          format: date
        theoreticalBalance:
          type: string
        actualBalance:
          type: string
        short:
          type: boolean
        cardBalances:
          type: object
          additionalProperties:
            type: string
        liquidAccountBalances:
          type: array
          items:
            $ref: "#/components/schemas/LiquidAccountBalance"
        negativeLiquidAccountIds:
          type: array
          items:
            $ref: "#/components/schemas/UuidLike"
        eventSummary:
          $ref: "#/components/schemas/DailyEventSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/DailyEventExplanation"

    LiquidAccountBalance:
      type: object
      required: [accountId, name, type, balance]
      properties:
        accountId:
          $ref: "#/components/schemas/UuidLike"
        name:
          type: string
        type:
          type: string
          enum: [cash, bank]
        balance:
          type: string

    DailyEventSummary:
      type: object
      required:
        [totalCount, actualCount, forecastCount, actualAmount, forecastAmount, kinds]
      properties:
        totalCount:
          type: integer
          minimum: 0
        actualCount:
          type: integer
          minimum: 0
        forecastCount:
          type: integer
          minimum: 0
        actualAmount:
          type: string
        forecastAmount:
          type: string
        kinds:
          type: array
          items:
            type: string
            enum:
              [
                transaction,
                balance-event,
                scheduled-event,
                daily-spend-forecast,
                card-payment,
                card-payment-forecast
              ]

    DailyEventExplanation:
      type: object
      required: [id, kind, source, label, detail, amount, orderIndex, cardId]
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            [
              transaction,
              balance-event,
              scheduled-event,
              daily-spend-forecast,
              card-payment,
              card-payment-forecast
            ]
        source:
          type: string
          enum: [actual, forecast]
        label:
          type: string
        detail:
          type: string
        amount:
          type: string
        orderIndex:
          type: integer
          minimum: 0
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        basis:
          $ref: "#/components/schemas/ForecastBasis"

    ForecastBasis:
      type: object
      required: [sourceEventIds, summary]
      properties:
        sourceEventIds:
          type: array
          items:
            type: string
        summary:
          type: string

    SimulationResponse:
      type: object
      required: [snapshots, source, startDate, endDate, forecastSummary]
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/DailySimulationSnapshot"
        source:
          type: string
          enum: [database, demo]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        forecastSummary:
          $ref: "#/components/schemas/ForecastSummary"

    SimulationComparisonRequest:
      type: object
      required: [startDate, endDate, scenarios]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulationComparisonScenarioRequest"

    SimulationComparisonScenarioRequest:
      type: object
      required: [id, label, excludedEventIds]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        excludedEventIds:
          type: array
          items:
            $ref: "#/components/schemas/UuidLike"

    SimulationComparisonResponse:
      type: object
      required: [base, scenarios]
      properties:
        base:
          $ref: "#/components/schemas/SimulationResponse"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulationComparisonScenarioResult"

    SimulationComparisonScenarioResult:
      type: object
      required: [id, label, detail, excludedEventIds, simulation, diff]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        excludedEventIds:
          type: array
          items:
            $ref: "#/components/schemas/UuidLike"
        simulation:
          $ref: "#/components/schemas/SimulationResponse"
        diff:
          $ref: "#/components/schemas/SimulationComparisonDiff"

    SimulationComparisonDiff:
      type: object
      required:
        [
          shortCountDelta,
          projectedShortCountDelta,
          lowestTheoreticalBalanceDelta,
          lowestActualBalanceDelta,
          endingTheoreticalBalanceDelta,
          endingActualBalanceDelta
        ]
      properties:
        shortCountDelta:
          type: integer
        projectedShortCountDelta:
          type: integer
        lowestTheoreticalBalanceDelta:
          type: string
        lowestActualBalanceDelta:
          type: string
        endingTheoreticalBalanceDelta:
          type: string
        endingActualBalanceDelta:
          type: string

    ForecastSummary:
      type: object
      required:
        [
          actualsThroughDate,
          firstForecastDate,
          forecastDays,
          dailySpendForecastCount,
          dailySpendForecastAverageAmount,
          cardPaymentForecastCount,
          cardPaymentForecastTotalAmount
        ]
      properties:
        actualsThroughDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        firstForecastDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        forecastDays:
          type: integer
          minimum: 0
        dailySpendForecastCount:
          type: integer
          minimum: 0
        dailySpendForecastAverageAmount:
          type: string
        cardPaymentForecastCount:
          type: integer
          minimum: 0
        cardPaymentForecastTotalAmount:
          type: string

    SpreadsheetImportProfile:
      type: string
      enum:
        [
          financial-analysis-expense,
          financial-analysis-income,
          financial-analysis-recurring
        ]

    SpreadsheetImportIssue:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
          enum: [warning, error]
        rowNumber:
          type: integer
        message:
          type: string

    SpreadsheetImportPreviewRow:
      type: object
      required:
        [rowNumber, date, amount, payee, description, note, categoryPath, project, accountId, cardId, suggestion, appliedSuggestionFields, raw]
      properties:
        rowNumber:
          type: integer
        date:
          type: string
          format: date
        amount:
          type: string
        payee:
          type: string
        description:
          type: string
        note:
          type: string
        categoryPath:
          type: array
          items:
            type: string
        project:
          anyOf:
            - type: string
            - type: "null"
        accountId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        cardId:
          anyOf:
            - $ref: "#/components/schemas/UuidLike"
            - type: "null"
        suggestion:
          anyOf:
            - type: object
              required: [accountId, cardId, categoryPath, project, evidenceCount]
              properties:
                accountId:
                  anyOf:
                    - $ref: "#/components/schemas/UuidLike"
                    - type: "null"
                cardId:
                  anyOf:
                    - $ref: "#/components/schemas/UuidLike"
                    - type: "null"
                categoryPath:
                  type: array
                  items:
                    type: string
                project:
                  anyOf:
                    - type: string
                    - type: "null"
                evidenceCount:
                  type: integer
            - type: "null"
        appliedSuggestionFields:
          type: array
          items:
            type: string
        raw:
          type: array
          items:
            type: string

    SpreadsheetImportPreview:
      type: object
      required:
        [fileName, sheets, selectedSheetName, selectedProfile, targetKind, canImport, issues, previewRows]
      properties:
        fileName:
          type: string
        sheets:
          type: array
          items:
            type: object
            required: [name, rowCount, suggestion]
            properties:
              name:
                type: string
              rowCount:
                type: integer
              suggestion:
                anyOf:
                  - $ref: "#/components/schemas/SpreadsheetImportProfile"
                  - type: "null"
        selectedSheetName:
          anyOf:
            - type: string
            - type: "null"
        selectedProfile:
          anyOf:
            - $ref: "#/components/schemas/SpreadsheetImportProfile"
            - type: "null"
        targetKind:
          type: string
          enum: [transaction]
        canImport:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SpreadsheetImportIssue"
        previewRows:
          type: array
          items:
            $ref: "#/components/schemas/SpreadsheetImportPreviewRow"

    SpreadsheetImportResult:
      type: object
      required: [importedCount, targetKind, selectedSheetName, selectedProfile]
      properties:
        importedCount:
          type: integer
        targetKind:
          type: string
          enum: [transaction]
        selectedSheetName:
          anyOf:
            - type: string
            - type: "null"
        selectedProfile:
          anyOf:
            - $ref: "#/components/schemas/SpreadsheetImportProfile"
            - type: "null"

    UuidLike:
      type: string
      description: UUID-like identifier currently accepted by the backend validation layer
      pattern: "^[0-9a-fA-F-]{36}$"
